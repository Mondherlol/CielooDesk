<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parametres d'impression - CielooPos</title>
  <script type="module" src="/src/print-settings.ts"></script>
</head>
<body>
  <div class="print-shell">
    <header class="print-header">
      <div class="print-header-left">
        <h1>Parametres d'impression</h1>
        <p>Configurez une ou plusieurs imprimantes thermiques</p>
      </div>
      <div class="print-header-actions">
        <button id="btn-reload-sections" class="p-icon-btn" title="Recharger les sections MultiPrint">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
        <button id="btn-install-driver" class="btn-install-driver">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Installer le driver
        </button>
      </div>
    </header>

    <section class="card">
      <div id="tab-nav" class="tab-nav"></div>
      <div id="tab-panels" class="tab-panels"></div>

      <div class="actions">
        <button id="btn-save-print" class="btn btn-primary">Enregistrer</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>
</body>
</html>
