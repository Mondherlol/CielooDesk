<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erreur — CaisLà</title>
    <script type="module" src="/src/error.ts"></script>
    <style>
      :root{
        --bg:#f5f7fb; --surface:#ffffff; --border:#e4e9f2; --text:#111827; --text-2:#374151;
        --muted:#9ca3af; --accent:#f97316; --accent-strong:#ea580c; --danger:#ef4444;
      }
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{width:100%;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
        background:
          radial-gradient(780px 360px at 7% -10%, rgba(249,115,22,.12) 0%, rgba(249,115,22,0) 70%),
          radial-gradient(560px 300px at 95% 120%, rgba(239,68,68,.10) 0%, rgba(239,68,68,0) 74%),
          var(--bg);
        color:var(--text)}
      .shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
      .card{width:min(520px,100%);background:var(--surface);border:1px solid var(--border);border-radius:18px;
        box-shadow:0 16px 50px rgba(15,23,42,.12),0 2px 8px rgba(15,23,42,.06);overflow:hidden;
        animation:in .35s cubic-bezier(.22,1,.36,1) both}
      .card::before{content:'';display:block;height:5px;background:linear-gradient(90deg,var(--accent),var(--danger))}
      .inner{padding:30px 30px 26px;display:grid;gap:14px}
      .brand{display:flex;align-items:center;gap:10px}
      .brand img{width:32px;height:32px;border-radius:9px}
      .brand span{font-size:.86rem;font-weight:600;color:#64748b}
      .badge-ico{width:74px;height:74px;margin:2px auto 0;border-radius:50%;
        background:linear-gradient(135deg,#fee2e2 0%,#ffedd5 100%);color:var(--danger);
        display:flex;align-items:center;justify-content:center}
      .badge-ico svg{width:36px;height:36px}
      h1{text-align:center;font-size:1.34rem;line-height:1.2;letter-spacing:-.02em;font-weight:800}
      #message{text-align:center;font-size:.94rem;line-height:1.55;color:var(--text-2);max-width:42ch;margin:0 auto}
      #detail{display:none;background:#f8fafc;border:1px solid var(--border);border-radius:11px;padding:11px 13px;
        font-family:ui-monospace,SFMono-Regular,monospace;font-size:.78rem;color:#475569;
        line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:140px;overflow:auto}
      #detail.show{display:block}
      .code-row{display:flex;align-items:center;justify-content:center;gap:8px}
      #code{display:none;font-size:.74rem;font-weight:700;letter-spacing:.04em;color:var(--accent-strong);
        background:#fff4ea;border:1px solid #fbd6b0;border-radius:999px;padding:4px 11px;font-family:ui-monospace,monospace}
      #code.show{display:inline-block}
      .actions{display:flex;gap:10px;margin-top:6px}
      .btn{flex:1;border:none;border-radius:11px;padding:12px 18px;font-family:inherit;font-size:.94rem;
        font-weight:700;cursor:pointer;transition:filter .15s,transform .15s}
      .btn-primary{background:linear-gradient(135deg,var(--accent),#fb923c);color:#fff;box-shadow:0 3px 12px rgba(249,115,22,.3)}
      .btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
      .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--text-2)}
      .btn-ghost:hover{background:#f4f6fb}
      @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="inner">
          <div class="brand">
            <img src="/logo_CaisLa.png" alt="CaisLà" />
            <span>CaisLà</span>
          </div>

          <div class="badge-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </div>

          <h1 id="title">Une erreur est survenue</h1>
          <p id="message">La caisse a rencontré un problème inattendu.</p>
          <div class="code-row"><span id="code"></span></div>
          <div id="detail"></div>

          <div class="actions">
            <button id="btn-copy" class="btn btn-ghost">Copier le détail</button>
            <button id="btn-retry" class="btn btn-primary">Réessayer</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
