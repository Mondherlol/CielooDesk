appId: io.cieloo.cieloopos
productName: CaisLà
directories:
  output: release
compression: maximum
asar: true
electronLanguages:
  - fr
  - en-US
files:
  - out/**
  - package.json
extraResources:
  # Caisse de secours hors-ligne : bundle statique chargé par la fenêtre
  # principale quand la wifi coupe (voir src/modules/offline-pos).
  - from: pos-offline/dist
    to: pos-offline
  - from: assets
    to: assets
    filter:
      - SumatraPDF-settings.txt
      - AnyDesk.exe
      - RustDesk.exe
      - E001_POS.driver.2025.09.28.01.exe
  - from: assets/img
    to: assets/img
win:
  icon: assets/img/favicon.ico
  target:
    - nsis
nsis:
  oneClick: true
  # Install machine-wide (une invite UAC à l'installation par le technicien). Requis
  # pour que build/installer.nsh accorde aux Utilisateurs le droit d'écrire dans le
  # dossier de données partagé C:\ProgramData\CielooPosv2 (multi-comptes Windows).
  perMachine: true
publish:
  provider: github
  owner: mondherlol
  repo: CielooDesk
