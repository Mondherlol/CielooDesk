appId: io.cieloo.cieloopos
productName: CaisLà
directories:
  output: release
compression: maximum
asar: true
electronLanguages:
  - fr
  - en-US
files:
  - out/**
  - package.json
extraResources:
  - from: assets
    to: assets
    filter:
      - SumatraPDF-settings.txt
      - AnyDesk.exe
      - RustDesk.exe
      - E001_POS.driver.2025.09.28.01.exe
  - from: assets/img
    to: assets/img
win:
  icon: assets/img/favicon.ico
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
publish:
  provider: github
  owner: mondherlol
  repo: CielooDesk
